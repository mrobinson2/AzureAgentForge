<svg xmlns="http://www.w3.org/2000/svg" width="1654" height="1169" viewBox="0 0 1654 1169" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="azBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3399E5"/>
      <stop offset="1" stop-color="#0066B4"/>
    </linearGradient>
    <linearGradient id="azGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CB36B"/>
      <stop offset="1" stop-color="#2E7D3D"/>
    </linearGradient>
    <linearGradient id="azGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0B65C"/>
      <stop offset="1" stop-color="#C18B27"/>
    </linearGradient>
    <linearGradient id="azGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AEB9C4"/>
      <stop offset="1" stop-color="#8593A1"/>
    </linearGradient>
    <linearGradient id="azSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A93AB"/>
      <stop offset="1" stop-color="#52708C"/>
    </linearGradient>
    <marker id="arrNavy" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0B3D66"/></marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3C7A47"/></marker>
    <marker id="arrGold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C9851F"/></marker>
    <marker id="arrGrey" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="none" stroke="#7A8895" stroke-width="1.4"/></marker>
  </defs>

  <rect width="1654" height="1169" fill="#FFFFFF"/>

  <!-- ===== TITLE BLOCK ===== -->
  <rect x="40" y="32" width="1574" height="62" fill="#0B3D66"/>
  <text x="60" y="71" fill="#FFFFFF" font-size="22" font-weight="700">AzureAgentForge — Network Topology</text>
  <text x="1594" y="68" fill="#BBD7EE" font-size="12" text-anchor="end">VNet · subnets · delegations · private DNS · NSGs · private endpoints · ingress modes · v1.3</text>

  <!-- ===== INGRESS BAND ===== -->
  <rect x="100" y="116" width="1454" height="120" rx="8" fill="#F5F7FA" stroke="#AEB9C4"/>
  <text x="116" y="135" fill="#5B7A95" font-size="11" font-weight="700">Public ingress (two selectable modes — one active per deployment)</text>

  <!-- internet client glyph -->
  <g transform="translate(150,148)">
    <circle cx="23" cy="15" r="9" fill="url(#azBlue)"/>
    <path d="M6,40 a17,15 0 0 1 34,0 Z" fill="url(#azBlue)"/>
    <text x="23" y="62" fill="#23272E" font-size="11" text-anchor="middle">Internet client</text>
  </g>

  <!-- Mode A: ACA managed ingress -->
  <rect x="300" y="138" width="430" height="80" rx="8" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <rect x="312" y="150" width="28" height="28" rx="4" fill="url(#azBlue)"/>
  <path d="M318,164 h16 M325,158 l7,6 l-7,6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="348" y="164" fill="#1B2733" font-size="12" font-weight="700">Mode A · ACA managed ingress</text>
  <text x="348" y="188" fill="#5B6B7B" font-size="10">cost-optimized default (cloudflared_enabled=false) · public</text>
  <text x="348" y="202" fill="#5B6B7B" font-size="10">ingress restricted by gateway_allowed_ip_addresses</text>

  <!-- Mode B: Cloudflared tunnel (hardened, dashed) -->
  <rect x="770" y="138" width="450" height="80" rx="8" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="782" y="150" width="28" height="28" rx="4" fill="url(#azGrey)"/>
  <path d="M788,164 h16 M795,158 l7,6 l-7,6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="818" y="164" fill="#42505E" font-size="12" font-weight="700">Mode B · Cloudflared tunnel  (hardened)</text>
  <text x="818" y="188" fill="#6B7886" font-size="10">cloudflared_enabled=true · outbound-only connector container in</text>
  <text x="818" y="202" fill="#6B7886" font-size="10">app-subnet · NO public inbound port; routes via Cloudflare edge</text>

  <!-- Cloudflare edge marker -->
  <rect x="1248" y="150" width="120" height="56" rx="8" fill="#FBF7F0" stroke="#C9A45B" stroke-dasharray="4 3"/>
  <text x="1308" y="176" fill="#8A6D1F" font-size="10" text-anchor="middle">Cloudflare edge</text>
  <text x="1308" y="192" fill="#8A6D1F" font-size="10" text-anchor="middle">(external)</text>

  <!-- ===== AZURE REGION BOUNDARY ===== -->
  <rect x="100" y="262" width="1454" height="846" rx="10" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 4"/>
  <g transform="translate(114,272)">
    <rect x="0" y="0" width="26" height="26" rx="4" fill="url(#azBlue)"/>
    <path d="M6,18 L13,6 L20,18 Z" fill="#FFFFFF"/>
  </g>
  <text x="148" y="290" fill="#0078D4" font-size="12" font-weight="700">Azure region · single subscription / resource group · ${prefix}-rg</text>

  <!-- ===== VNET BOUNDARY ===== -->
  <rect x="128" y="316" width="1398" height="772" rx="10" fill="#F2F8FD" fill-opacity="0.6" stroke="#0B6BB0" stroke-width="2" stroke-dasharray="6 4"/>
  <g transform="translate(142,326)">
    <rect x="0" y="2" width="26" height="22" rx="3" fill="url(#azBlue)"/>
    <path d="M5,8 h16 M5,13 h16 M5,18 h10" stroke="#FFFFFF" stroke-width="1.6"/>
  </g>
  <text x="176" y="344" fill="#0B6BB0" font-size="12" font-weight="700">${prefix}-vnet · 10.0.0.0/16 · module-managed (or bring-your-own via existing_vnet_name)</text>

  <!-- ===== APP-SUBNET ===== -->
  <rect x="152" y="378" width="690" height="350" rx="8" fill="#E9F3FB" stroke="#0078D4" stroke-width="1.5"/>
  <g transform="translate(166,388)">
    <rect x="0" y="2" width="24" height="20" rx="3" fill="url(#azBlue)"/>
    <path d="M5,7 h14 M5,12 h14 M5,17 h9" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="198" y="405" fill="#0078D4" font-size="12" font-weight="700">app-subnet · 10.0.1.0/24</text>
  <text x="198" y="422" fill="#5B7A95" font-size="10" font-style="italic">delegation: Microsoft.App/environments</text>

  <!-- NSG badge -->
  <rect x="690" y="386" width="26" height="26" rx="4" fill="url(#azBlue)"/>
  <path d="M703,390 l9,4 v6 a9,9 0 0 1 -9,8 a9,9 0 0 1 -9,-8 v-6 Z" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="722" y="393" fill="#42505E" font-size="9" font-weight="700">${prefix}-app-nsg</text>
  <text x="722" y="405" fill="#42505E" font-size="9">Allow 443 from VNet · DenyAll (4096)</text>

  <!-- Container Apps Environment -->
  <rect x="176" y="438" width="642" height="270" rx="6" fill="#F4F9FD" stroke="#7FB2DC" stroke-width="1.2"/>
  <rect x="188" y="448" width="24" height="24" rx="3" fill="url(#azBlue)"/>
  <path d="M193,460 h14 M200,453 v14" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="220" y="464" fill="#2E6CA3" font-size="11" font-weight="700">Container Apps Environment · ${prefix}-env · infrastructure_subnet = app-subnet · internal_load_balancer_enabled = false (dev)</text>

  <!-- PaperClip -->
  <rect x="196" y="486" width="180" height="60" rx="7" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="204" y="504" fill="#1B2733" font-size="11" font-weight="700">PaperClip</text>
  <text x="204" y="520" fill="#5B6B7B" font-size="10">internal ingress · :3100</text>
  <rect x="338" y="492" width="22" height="22" rx="3" fill="url(#azBlue)"/>
  <path d="M343,510 v-12 h7 a3.5,3.5 0 0 1 0,7 h-7" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- Hermes + Router -->
  <rect x="394" y="486" width="190" height="60" rx="7" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="402" y="504" fill="#1B2733" font-size="11" font-weight="700">Hermes + Router</text>
  <text x="402" y="520" fill="#5B6B7B" font-size="10">internal ingress · :8080</text>
  <rect x="556" y="492" width="22" height="22" rx="3" fill="url(#azBlue)"/>
  <path d="M561,510 l5,-12 l5,12 M563,506 h6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- Honcho -->
  <rect x="602" y="486" width="200" height="60" rx="7" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="610" y="504" fill="#1B2733" font-size="11" font-weight="700">Honcho</text>
  <text x="610" y="520" fill="#5B6B7B" font-size="10">internal ingress · :8000</text>
  <rect x="774" y="492" width="22" height="22" rx="3" fill="url(#azBlue)"/>
  <ellipse cx="785" cy="500" rx="7" ry="2.6" fill="#FFFFFF"/>
  <path d="M778,500 v9 a7,2.6 0 0 0 14,0 v-9" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>

  <!-- optional apps row -->
  <rect x="196" y="556" width="388" height="32" rx="6" fill="#F7F8FA" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="204" y="576" fill="#42505E" font-size="10">cloudflared connector  (hardened — outbound only, no ingress)</text>

  <rect x="602" y="556" width="200" height="32" rx="6" fill="#F7F8FA" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="610" y="576" fill="#42505E" font-size="10">teams-bridge (opt) · :3978</text>

  <rect x="196" y="598" width="388" height="32" rx="6" fill="#F7F8FA" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="204" y="618" fill="#42505E" font-size="10">memory-governor  (opt) · internal :8090</text>

  <rect x="602" y="598" width="200" height="32" rx="6" fill="#F7F8FA" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="610" y="618" fill="#6B7886" font-size="10">Jobs (cron): deriver · sweeper</text>

  <text x="196" y="658" fill="#5B6B7B" font-size="9" font-style="italic">All apps run with external_enabled = false (internal-only ingress).</text>
  <text x="196" y="672" fill="#5B6B7B" font-size="9" font-style="italic">Public reach comes solely from the active ingress mode above.</text>

  <!-- ===== DB-SUBNET ===== -->
  <rect x="876" y="378" width="630" height="200" rx="8" fill="#EDF6EE" stroke="#5FA56B" stroke-width="1.5"/>
  <g transform="translate(890,388)">
    <rect x="0" y="2" width="24" height="20" rx="3" fill="url(#azGreen)"/>
    <path d="M5,7 h14 M5,12 h14 M5,17 h9" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="922" y="405" fill="#3C7A47" font-size="12" font-weight="700">db-subnet · 10.0.2.0/24</text>
  <text x="922" y="422" fill="#5B7A95" font-size="10" font-style="italic">delegation: Microsoft.DBforPostgreSQL/flexibleServers</text>

  <rect x="900" y="438" width="582" height="120" rx="7" fill="#FFFFFF" stroke="#5FA56B" stroke-width="1.5"/>
  <rect x="912" y="450" width="30" height="30" rx="4" fill="url(#azGreen)"/>
  <ellipse cx="927" cy="459" rx="9" ry="3.5" fill="#FFFFFF"/>
  <path d="M918,459 v12 a9,3.5 0 0 0 18,0 v-12" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="950" y="466" fill="#1B2733" font-size="12" font-weight="700">PostgreSQL Flexible Server</text>
  <text x="1454" y="464" font-size="14">🔒</text>
  <text x="912" y="498" fill="#5B6B7B" font-size="10">VNet-injected into db-subnet (delegated_subnet_id) · public_network_access = false</text>
  <text x="912" y="514" fill="#5B6B7B" font-size="10">private FQDN resolved via the Postgres private DNS zone · pgvector enabled</text>
  <text x="912" y="530" fill="#5B6B7B" font-size="10">honcho database · HA standby zone-redundant in hardened profile</text>

  <!-- ===== PE-SUBNET ===== -->
  <rect x="876" y="600" width="630" height="220" rx="8" fill="#F8FAFB" stroke="#9AA7B4" stroke-width="1.2"/>
  <g transform="translate(890,610)">
    <rect x="0" y="2" width="24" height="20" rx="3" fill="url(#azSlate)"/>
    <path d="M5,7 h14 M5,12 h14 M5,17 h9" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="922" y="627" fill="#42505E" font-size="12" font-weight="700">pe-subnet · 10.0.3.0/24 · private-endpoint subnet (no delegation, no NSG)</text>

  <!-- Key Vault -->
  <rect x="900" y="644" width="300" height="156" rx="7" fill="#FFFFFF" stroke="#5FA56B" stroke-width="1.5"/>
  <rect x="912" y="656" width="30" height="30" rx="4" fill="url(#azGreen)"/>
  <path d="M927,663 a4,4 0 0 1 4,4 v3 h-8 v-3 a4,4 0 0 1 4,-4 Z M920,670 h14 v9 h-14 Z" fill="#FFFFFF"/>
  <text x="950" y="674" fill="#1B2733" font-size="12" font-weight="700">Key Vault</text>
  <text x="1172" y="672" font-size="14">🔒</text>
  <text x="912" y="708" fill="#5B6B7B" font-size="10">cost-optimized: public endpoint + IP firewall</text>
  <text x="912" y="722" fill="#5B6B7B" font-size="10">(network_default_action / allowed_ip_ranges)</text>
  <text x="912" y="736" fill="#5B6B7B" font-size="10">hardened: public_network_access = false →</text>
  <text x="912" y="750" fill="#5B6B7B" font-size="10">private DNS zone created + VNet-linked</text>

  <!-- KV private endpoint (design-intent, dashed) -->
  <rect x="1230" y="644" width="256" height="100" rx="8" fill="#F7F8FA" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="1242" y="656" width="26" height="26" rx="4" fill="url(#azGrey)"/>
  <circle cx="1251" cy="669" r="4" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="1259" cy="669" r="4" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="1276" y="671" fill="#42505E" font-size="11" font-weight="700">Key Vault private endpoint</text>
  <text x="1242" y="697" fill="#6B7886" font-size="9">hardened design-intent (in pe-subnet).</text>
  <text x="1242" y="709" fill="#6B7886" font-size="9">Private DNS zone + VNet link are created</text>
  <text x="1242" y="721" fill="#6B7886" font-size="9">by Terraform; the private endpoint NIC</text>
  <text x="1242" y="733" fill="#6B7886" font-size="9">itself is operator-provisioned.</text>

  <!-- ===== ADMIN-SUBNET ===== -->
  <rect x="152" y="744" width="690" height="84" rx="8" fill="#F8FAFB" stroke="#9AA7B4" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g transform="translate(166,754)">
    <rect x="0" y="2" width="24" height="20" rx="3" fill="url(#azGrey)"/>
    <path d="M5,7 h14 M5,12 h14 M5,17 h9" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="198" y="771" fill="#42505E" font-size="12" font-weight="700">admin-subnet · 10.0.4.0/24</text>
  <text x="198" y="793" fill="#6B7886" font-size="10">reserved for jump box / build agents — subnet is Terraform-managed; no compute is</text>
  <text x="198" y="807" fill="#6B7886" font-size="10">deployed into it by the platform (operator-provisioned).</text>

  <!-- ===== PRIVATE DNS ZONES ===== -->
  <rect x="152" y="846" width="1354" height="92" rx="6" fill="#EDF6EE" stroke="#5FA56B"/>
  <text x="168" y="865" fill="#3C7A47" font-size="11" font-weight="700">Private DNS zones · VNet-linked</text>

  <rect x="172" y="884" width="26" height="26" rx="4" fill="url(#azGreen)"/>
  <path d="M185,888 a10,10 0 1 0 0.01,0 M177,897 h16 M185,888 q-5,9 0,18 q5,-9 0,-18" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="206" y="893" fill="#1B2733" font-size="11" font-weight="700">private.postgres.database.azure.com</text>
  <text x="206" y="911" fill="#5B6B7B" font-size="10">always created · resolves the Postgres private FQDN</text>

  <rect x="620" y="884" width="26" height="26" rx="4" fill="url(#azGrey)"/>
  <path d="M633,888 a10,10 0 1 0 0.01,0 M625,897 h16 M633,888 q-5,9 0,18 q5,-9 0,-18" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="654" y="893" fill="#42505E" font-size="11" font-weight="700">privatelink.vaultcore.azure.net</text>
  <text x="654" y="911" fill="#6B7886" font-size="10" font-style="italic">hardened only · created when key_vault_private_access = true</text>

  <text x="1056" y="890" fill="#3C7A47" font-size="9" font-style="italic">DNS zones are region/RG-scoped resources, each</text>
  <text x="1056" y="903" fill="#3C7A47" font-size="9" font-style="italic">linked to the VNet via a</text>
  <text x="1056" y="916" fill="#3C7A47" font-size="9" font-style="italic">private_dns_zone_virtual_network_link.</text>

  <!-- ===== FLOW EDGES ===== -->
  <!-- 1 client -> ACA ingress -->
  <path d="M198,171 H300" fill="none" stroke="#0B3D66" stroke-width="2" marker-end="url(#arrNavy)"/>
  <circle cx="250" cy="171" r="10" fill="#0B3D66"/><text x="250" y="175" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1</text>

  <!-- 1b cloudflare edge -> tunnel (gold dashed) -->
  <path d="M1248,178 H1220" fill="none" stroke="#C9851F" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrGold)"/>
  <text x="1278" y="132" fill="#C9851F" font-size="9" font-style="italic" text-anchor="middle">hardened path</text>

  <!-- 2 ACA ingress -> PaperClip (internal) -->
  <path d="M365,218 V456 H286 V486" fill="none" stroke="#0B3D66" stroke-width="2" marker-end="url(#arrNavy)"/>
  <rect x="296" y="424" width="138" height="16" rx="8" fill="#FFFFFF" stroke="#0B3D66"/><text x="365" y="436" fill="#0B3D66" font-size="9" font-weight="700" text-anchor="middle">2 to internal app ingress</text>

  <!-- 2b cloudflared connector -> PaperClip (gold dashed, internal) -->
  <path d="M390,556 V550 H352 V546" fill="none" stroke="#C9851F" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrGold)"/>

  <!-- 3 Honcho -> Postgres across subnets -->
  <path d="M802,504 H860 V498 H900" fill="none" stroke="#3C7A47" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="804" y="470" width="172" height="16" rx="8" fill="#FFFFFF" stroke="#3C7A47"/><text x="890" y="482" fill="#3C7A47" font-size="9" font-weight="700" text-anchor="middle">3 private DB traffic (db-subnet)</text>

  <!-- 4 Postgres -> Postgres private DNS zone -->
  <path d="M900,558 V610 H185 V884" fill="none" stroke="#7A8895" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrGrey)"/>
  <text x="168" y="760" fill="#7A8895" font-size="9" font-style="italic" text-anchor="middle">name resolution</text>

  <!-- 5 KV -> KV private endpoint -->
  <path d="M1200,690 H1230" fill="none" stroke="#7A8895" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrGrey)"/>
  <text x="1260" y="640" fill="#7A8895" font-size="9" font-style="italic" text-anchor="middle">private access (hardened)</text>

  <!-- 6 KV private endpoint -> KV private DNS zone -->
  <path d="M1256,744 V828 H633 V910" fill="none" stroke="#7A8895" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrGrey)"/>

  <!-- ===== LEGEND ===== -->
  <rect x="100" y="1116" width="922" height="44" rx="4" fill="#FFFFFF" stroke="#AEB9C4"/>
  <text x="114" y="1142" fill="#1B2733" font-size="11" font-weight="700">Legend</text>

  <line x1="180" y1="1138" x2="224" y2="1138" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="230" y="1142" fill="#42505E" font-size="10">trust boundary (region / VNet / subnet)</text>

  <line x1="470" y1="1138" x2="514" y2="1138" stroke="#0B3D66" stroke-width="2" marker-end="url(#arrNavy)"/>
  <circle cx="491" cy="1138" r="9" fill="#0B3D66"/><text x="491" y="1142" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">n</text>
  <text x="520" y="1142" fill="#42505E" font-size="10">numbered network path</text>

  <line x1="676" y1="1138" x2="720" y2="1138" stroke="#7A8895" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrGrey)"/>
  <text x="726" y="1142" fill="#42505E" font-size="10">control / DNS / private-link access</text>

  <text x="1040" y="1134" fill="#6B7886" font-size="10" font-style="italic">Dashed outline / muted grey = hardened-profile-only or design-intent</text>
  <text x="1040" y="1148" fill="#6B7886" font-size="10" font-style="italic">(KV private endpoint, Cloudflared, admin-subnet compute, optional apps).</text>
</svg>
