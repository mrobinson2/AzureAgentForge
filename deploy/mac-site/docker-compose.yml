# Self-hosted PRIMARY site — the platform stack on an always-on local host, with
# Azure Container Apps as a warm standby. See the self-hosted-primary ADR in
# docs/design/ for the full model.
#
# The DATABASE NEVER MOVES: both sites share the SAME managed PostgreSQL Flexible
# Server over its public endpoint (${AZURE_PG_HOST}, sslmode=require), so a site
# switch is a STATELESS COMPUTE SWITCH — no dumps, no restores, no data gravity.
# There is no local postgres here; the shared managed server is the single writer.
#
# Bring the stack up ONLY via `scripts/aaf-site`, never a bare `docker compose up`:
# the switch refreshes the lease mirror that lease-guard checks (below), and
# boot-guard.sh backstops the restart-after-reboot hole that lease-guard can't see.
#
# Notes:
#  - Every long-running service waits on lease-guard (single-writer guard).
#  - DB URLs mirror the schemes each service expects: honcho DB_CONNECTION_URI and
#    the governor DATABASE_URL use the SQLAlchemy postgresql+psycopg:// dialect;
#    paperclip DATABASE_URL is plain postgresql://.
#  - Secrets come from .env (generated by secrets-pull.sh from Key Vault). The
#    only structural difference vs the cloud deployment is the shared-external
#    DB host and the image source (pre-built tags pulled from your registry).
#  - Periodic jobs (deriver, sweeper, curator) are `profiles: [jobs]` and fired by
#    a host timer via `docker compose run --rm <svc>` — compose has no cron.
#  - cloudflared is `profiles: [live]` — started only when this site holds the
#    lease, so the tunnel never has two live connectors.

x-acr: &acr "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}"

# Router model-tier config (name + output cap + daily budget). The router
# registers a tier only when it can map that tier to a concrete model NAME plus
# an output cap and a daily budget; the *_BASE_URL / *_API_KEY come from .env.
# Without the model NAME the tier can't resolve a deployment and calls fail.
# Generic defaults — override in .env. Mirrors the root docker-compose.yml anchor.
x-router-models: &router-models
  GPT4O_MAX_TOKENS: ${GPT4O_MAX_TOKENS:-4096}
  GPT4O_DAILY_BUDGET_USD: ${GPT4O_DAILY_BUDGET_USD:-5.00}
  PHI_MODEL: ${PHI_MODEL:-Phi-4}
  PHI_MAX_TOKENS: ${PHI_MAX_TOKENS:-2048}
  PHI_DAILY_BUDGET_USD: ${PHI_DAILY_BUDGET_USD:-0.50}

services:
  # ── Single-writer lease guard — every service waits on this ────────────────
  # Refuses to start unless the local lease mirror names THIS site. The mirror is
  # refreshed from the `platform-active-site` Key Vault secret by scripts/aaf-site
  # immediately before every bring-up, so a home host never has to hold a service
  # principal. This is the structural guarantee against split-brain (two live
  # sites answering the same tunnel and double-processing work).
  lease-guard:
    image: alpine:3.20
    container_name: aaf-lease-guard
    restart: "no"
    volumes:
      - ./lease-guard.sh:/lease-guard.sh:ro
      - ${AAF_HOME:-~/aaf}/active-site:/lease/active-site:ro
    command: ["/bin/sh", "/lease-guard.sh"]

  # ── Honcho (memory API) ────────────────────────────────────────────────────
  honcho:
    image: "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}/honcho:${HONCHO_IMAGE_TAG:?aaf-0025: pin an explicit image tag in .env, not floating latest}"
    container_name: aaf-honcho
    restart: unless-stopped
    depends_on:
      lease-guard:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      DB_CONNECTION_URI: "postgresql+psycopg://${POSTGRES_USER:-dbadmin}:${POSTGRES_PASSWORD_URLENC:?run secrets-pull.sh}@${AZURE_PG_HOST:?set in .env}:5432/honcho?sslmode=require"
      # Honcho builds an LLM client per specialist at import and raises on a
      # missing key; point summary/deriver at the OpenAI-compatible provider.
      LLM_OPENAI_API_KEY: "${EMBEDDING_API_KEY:?run secrets-pull.sh}"
      SUMMARY_PROVIDER: "openai"
      SUMMARY_MODEL: "gpt-4o-mini"
      DERIVER_PROVIDER: "openai"
      DERIVER_MODEL: "gpt-4o-mini"
      # Honcho requires ALL FIVE dialectic reasoning levels; a missing level
      # crash-loops the service on boot. Nested pydantic-settings path
      # (env_prefix DIALECTIC_ + "__" delimiter); the flat form is ignored.
      DIALECTIC_LEVELS__minimal__PROVIDER: "openai"
      DIALECTIC_LEVELS__minimal__MODEL: "gpt-4o-mini"
      DIALECTIC_LEVELS__minimal__THINKING_BUDGET_TOKENS: "0"
      DIALECTIC_LEVELS__minimal__MAX_TOOL_ITERATIONS: "1"
      DIALECTIC_LEVELS__low__PROVIDER: "openai"
      DIALECTIC_LEVELS__low__MODEL: "gpt-4o-mini"
      DIALECTIC_LEVELS__low__THINKING_BUDGET_TOKENS: "0"
      DIALECTIC_LEVELS__low__MAX_TOOL_ITERATIONS: "2"
      DIALECTIC_LEVELS__medium__PROVIDER: "openai"
      DIALECTIC_LEVELS__medium__MODEL: "gpt-4o-mini"
      DIALECTIC_LEVELS__medium__THINKING_BUDGET_TOKENS: "0"
      DIALECTIC_LEVELS__medium__MAX_TOOL_ITERATIONS: "3"
      DIALECTIC_LEVELS__high__PROVIDER: "openai"
      DIALECTIC_LEVELS__high__MODEL: "gpt-4o-mini"
      DIALECTIC_LEVELS__high__THINKING_BUDGET_TOKENS: "0"
      DIALECTIC_LEVELS__high__MAX_TOOL_ITERATIONS: "4"
      DIALECTIC_LEVELS__max__PROVIDER: "openai"
      DIALECTIC_LEVELS__max__MODEL: "gpt-4o-mini"
      DIALECTIC_LEVELS__max__THINKING_BUDGET_TOKENS: "0"
      DIALECTIC_LEVELS__max__MAX_TOOL_ITERATIONS: "5"

  # ── Model router (OpenAI-compatible tier router) ───────────────────────────
  model-router:
    image: "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}/model-router:${ROUTER_IMAGE_TAG:?aaf-0025: pin an explicit image tag in .env, not floating latest}"
    container_name: aaf-model-router
    restart: unless-stopped
    depends_on:
      lease-guard:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      <<: *router-models

  # ── Memory governor (governed-memory sidecar) ──────────────────────────────
  memory-governor:
    image: "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}/memory-governor:${MEMORY_GOVERNOR_IMAGE_TAG:?aaf-0025: pin an explicit image tag in .env, not floating latest}"
    container_name: aaf-memory-governor
    restart: unless-stopped
    depends_on:
      lease-guard:
        condition: service_completed_successfully
      honcho:
        condition: service_started
    env_file: [.env]
    environment:
      # Governor shares the honcho database (the agent_events spine lives there).
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-dbadmin}:${POSTGRES_PASSWORD_URLENC:?run secrets-pull.sh}@${AZURE_PG_HOST:?set in .env}:5432/honcho?sslmode=require"
      ROUTER_BASE_URL: "http://model-router:8080/v1"
      HONCHO_BASE_URL: "http://honcho:8000"

  # ── PaperClip (auth-proxy + UI/API + agent runtime) ────────────────────────
  paperclip:
    image: "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}/paperclip:${PAPERCLIP_IMAGE_TAG:?aaf-0025: pin an explicit image tag in .env, not floating latest}"
    container_name: aaf-paperclip
    restart: unless-stopped
    depends_on:
      lease-guard:
        condition: service_completed_successfully
      honcho:
        condition: service_started
    env_file: [.env]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dbadmin}:${POSTGRES_PASSWORD_URLENC:?run secrets-pull.sh}@${AZURE_PG_HOST:?set in .env}:5432/paperclip?sslmode=require"
      OPENAI_BASE_URL: "http://model-router:8080/v1"
      # aaf-0005: must match model-router's ROUTER_API_KEY (env_file above), or
      # every agent call the Hermes adapter makes through the router 401s.
      OPENAI_API_KEY: "${ROUTER_API_KEY:?run secrets-pull.sh}"
      GOVERNOR_BASE_URL: "http://memory-governor:8090"
      HONCHO_BASE_URL: "http://honcho:8000"
      # Agents run inside this container and authenticate with a local agent JWT
      # that only the backend on :3099 validates; the auth-proxy on :3100 accepts
      # only automation tokens. Point in-container agent calls at the backend so
      # they don't 401 against the proxy.
      PAPERCLIP_API_URL: "http://127.0.0.1:3099/api"
    ports: ["${PAPERCLIP_PORT:-3100}:3100"]
    volumes:
      - ${AAF_HOME:-~/aaf}/shares/paperclip-data:/paperclip

  # ── Cloudflare tunnel connector (started only when this site is live) ───────
  # One tunnel, two connectors (cloud + this host); the lease keeps exactly one
  # live at a time. The tunnel's remote origin points at http://paperclip:3100.
  cloudflared:
    # aaf-0025: pinned off floating :latest. Override CLOUDFLARED_TAG in .env to
    # bump deliberately; confirm the running digest with `docker inspect` and
    # prefer a @sha256 pin once known.
    image: "cloudflare/cloudflared:${CLOUDFLARED_TAG:-2024.12.2}"
    container_name: aaf-cloudflared
    restart: unless-stopped
    profiles: ["live"]
    depends_on:
      lease-guard:
        condition: service_completed_successfully
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?set in .env}"]

  # ── Periodic jobs (profiles: jobs) — fired by the host timer, not by `up` ───
  honcho-deriver:
    image: "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}/honcho:${HONCHO_IMAGE_TAG:?aaf-0025: pin an explicit image tag in .env, not floating latest}"
    profiles: ["jobs"]
    env_file: [.env]
    environment:
      DB_CONNECTION_URI: "postgresql+psycopg://${POSTGRES_USER:-dbadmin}:${POSTGRES_PASSWORD_URLENC:?run secrets-pull.sh}@${AZURE_PG_HOST:?set in .env}:5432/honcho?sslmode=require"
    command: ["python", "-m", "honcho.deriver"]

  memory-sweeper:
    image: "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}/memory-governor:${MEMORY_GOVERNOR_IMAGE_TAG:?aaf-0025: pin an explicit image tag in .env, not floating latest}"
    profiles: ["jobs"]
    env_file: [.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-dbadmin}:${POSTGRES_PASSWORD_URLENC:?run secrets-pull.sh}@${AZURE_PG_HOST:?set in .env}:5432/honcho?sslmode=require"
    command: ["python", "-m", "governor.sweeper"]

  skill-curator:
    image: "${ACR_LOGIN_SERVER:-your-registry.azurecr.io}/paperclip:${PAPERCLIP_IMAGE_TAG:?aaf-0025: pin an explicit image tag in .env, not floating latest}"
    profiles: ["jobs"]
    env_file: [.env]
    environment:
      OPENAI_BASE_URL: "http://model-router:8080/v1"
      # aaf-0005: see paperclip's OPENAI_API_KEY above — same requirement.
      OPENAI_API_KEY: "${ROUTER_API_KEY:?run secrets-pull.sh}"
    volumes:
      - ${AAF_HOME:-~/aaf}/shares/paperclip-data:/paperclip
    command: ["hermes", "curator", "run"]

networks:
  default:
    name: aaf-site
