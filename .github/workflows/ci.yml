name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Do NOT init submodules: the AAF secret scan covers AAF-authored code
          # and history only. Vendored upstreams (apps/*/src) carry their own
          # test fixtures/example tokens and are governed by their own upstreams
          # (the internal-ref scanner excludes them for the same reason).
          submodules: false
          fetch-depth: 0 # full history so the history scan below is meaningful
      - name: gitleaks (working tree + history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
          ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1
      - name: trufflehog (filesystem, verified only)
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog filesystem . --exclude-paths .trufflehog-exclude --fail --only-verified
      - name: internal-reference scan
        run: scripts/scan-internal-refs.sh

  build-context:
    runs-on: ubuntu-latest
    # Non-blocking until sub-project #2 ports the AAF-authored files the upstream
    # Dockerfiles COPY (apps/paperclip/*, apps/hermes/overrides/skills,
    # apps/honcho/docker-entrypoint.sh, build/skills/*.json). The job still runs
    # and reports exactly what is missing; flip to enforcing once #2 lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: validate upstream Dockerfile COPY sources resolve
        run: scripts/validate-build-context.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.5"
      - name: fmt
        run: terraform fmt -check -recursive infrastructure
      # terraform plan/apply are intentionally NOT in CI — they need Azure
      # credentials + a state backend. CI validates configuration.
      - name: validate
        working-directory: infrastructure/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: docker compose config -q
      - name: docker compose config (canary overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.canary.yml config -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/*.sh
      - name: agent-loop canary self-check (offline)
        run: bash scripts/smoke-canary.sh --self-check
      - name: keyvault seed DSN guard self-check (offline)
        run: bash scripts/seed-keyvault.sh --self-check

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: auth-proxy unit tests (no deps; node built-in runner)
        run: node --test tests/auth-proxy/*.test.mjs
      - name: sandbox seam unit tests (no deps; node built-in runner)
        run: node --test tests/sandbox/*.test.mjs
      - name: approval seam unit tests (no deps; node built-in runner)
        run: node --test tests/approval/*.test.mjs
      - name: paperclip vendored-defaults unit tests (provider pin + hermes config template)
        run: node --test tests/paperclip/*.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: agent profiles
        run: |
          pip install -r agents/requirements-dev.txt
          python agents/validate_profiles.py
          pytest -q agents/tests
      - name: replay fixtures
        run: python tests/replay/validate_fixtures.py
      - name: model-router
        run: |
          pip install -r services/model-router/requirements.txt -r services/model-router/requirements-dev.txt
          pytest -q services/model-router/tests
      - name: forge console (installer)
        run: |
          pip install -r installer/requirements.txt pytest httpx
          pytest -q installer/tests
      - name: memory-governor
        run: |
          pip install -r services/memory-governor/requirements.txt pytest
          pytest -q tests/memory-governor
      - name: watchdog
        run: pytest -q services/watchdog/tests
      - name: voice-core
        run: pytest -q services/voice-core/tests
      - name: multi-tenant per-user identity + RBAC (offline)
        run: |
          pip install fastapi
          pytest -q experimental/multi-tenant/control-plane/tests/test_user_tokens.py \
                    experimental/multi-tenant/control-plane/tests/test_tenant_budget.py \
                    experimental/multi-tenant/control-plane/tests/test_onboarding.py \
                    experimental/multi-tenant/memory-store/tests/test_user_auth.py \
                    experimental/multi-tenant/memory-store/tests/test_rbac.py
      - name: skill helpers (canonical user-peer threading, A5)
        run: pytest -q tests/skills
      - name: canary stub self-test
        run: python scripts/canary/anthropic_stub.py --self-test
      - name: compileall
        run: python -m compileall services installer scripts/canary

  # A3 — vendored-config schema guard. Every config key AAF ships to a
  # vendored app (compose/Terraform env blocks, the generated Hermes
  # config.yaml) must be read by the PINNED vendored source; keys the app
  # silently drops (the Honcho 3.0.7 flat-key removal class) fail here
  # instead of silently degrading a deployment.
  # docs/design/vendored-config-schema-guard.md
  validate-vendored-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The accepted-key universes are derived from the pinned vendored
          # source (honcho pydantic settings, hermes config parser), so the
          # submodules must be checked out — same as build-context.
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install guard deps
        run: pip install -r scripts/vendored-config/requirements.txt pytest
      - name: self-test (prove the guard detects seeded drift before trusting a pass)
        run: python scripts/validate_vendored_config.py --self-test
      - name: schema guard (shipped config vs pinned vendored schemas)
        run: python scripts/validate_vendored_config.py
      - name: validator unit tests
        run: pytest -q tests/vendored-config
